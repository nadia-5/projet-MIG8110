[project]
name = "proct_olis"
version = "1.0"
description = "Default template for PDM package"
authors = [
    {name = "imen-bendai", email = "imen.bendai@outlook.com"},
]
dependencies = [
    "click",
    "pyyaml",
    "polars",
    "pandas<2.2",
    "minio",
    "requests",
    "s3fs",
    "dotenv",
    "connectorx>=0.3.2",
    "pyarrow",
    "sqlalchemy",
    "psycopg2-binary",
    "numpy>=2.2.6",
    "apache-airflow",
    "fsspec==2023.12.2"
]
requires-python = "<3.13,>=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
[dependency-groups]
lint = [
    "ruff",
    "flake8",
    "black"
]
 
dev = [
    "pytest",
    "ipykernel",
    "pyspark",
    "notebook>=7.4.7",
    "jupyter>=1.1.1",
]

[project.scripts]
transformation = "proct_olis.app:main"

[tool.pdm.build]
includes = []
excludes = ["scripts/"]